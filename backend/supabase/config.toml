# Configuração local do projeto Supabase (KidsGuard).
# Ajuste project_id ao vincular: supabase link --project-ref <ref>
project_id = "kidsguard"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.ingest]
verify_jwt = false   # autenticado por x-device-token (não por JWT de usuário)

[functions.classify]
verify_jwt = true    # TRANCADA (era so teste) — exige Bearer JWT valido

[functions.classify-image]
verify_jwt = false   # autenticado por x-device-token (reforço por visão)

[functions.register-token]
verify_jwt = false   # autenticado por x-device-token (registro de push FCM)

[functions.summarize]
verify_jwt = true    # TRANCADA — cron/serviço chamam com Bearer service-role

[functions.notify]
verify_jwt = true    # TRANCADA — cron/serviço chamam com Bearer service-role
